<!DOCTYPE html>
<html lang="ja">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <style>
    :root { --fg: #1f2328; --muted: #656d76; --line: #d0d7de; --bg: #f6f8fa; --accent: #0969da; --warn: #9a6700; --warn-bg: #fff8c5; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif; color: var(--fg); background: #fff; line-height: 1.7; }
    main { max-width: 760px; margin: 0 auto; padding: 24px 16px 48px; }
    h1 { font-size: 1.4rem; margin: 0 0 4px; }
    .lead { color: var(--muted); font-size: .9rem; margin: 0 0 20px; }
    label { display: block; font-size: .85rem; color: var(--muted); margin: 12px 0 4px; }
    select, textarea { width: 100%; font: inherit; padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px; }
    textarea { min-height: 96px; resize: vertical; }
    button { margin-top: 12px; padding: 10px 20px; font: inherit; font-weight: 600; color: #fff; background: var(--accent); border: 0; border-radius: 6px; cursor: pointer; }
    button:disabled { opacity: .5; cursor: wait; }
    .card { border: 1px solid var(--line); border-radius: 8px; padding: 16px; margin-top: 20px; }
    .q { font-weight: 600; margin-bottom: 8px; white-space: pre-wrap; }
    .a { white-space: pre-wrap; }
    .meta { margin-top: 12px; font-size: .8rem; color: var(--muted); }
    .meta a { color: var(--accent); }
    .warn { margin-top: 12px; padding: 8px 12px; font-size: .85rem; color: var(--warn); background: var(--warn-bg); border-radius: 6px; }
    .err { color: #cf222e; }
    .note { margin-top: 24px; font-size: .8rem; color: var(--muted); }
  </style>
</head>
<body>
<main>
  <h1>社内規程Q&amp;A</h1>
  <p class="lead">就業規則や給与規程について、ふだんの言葉で質問できます。Boxにある最新の規程をもとに回答します。</p>

  <label for="category">あなたの区分(わかる範囲で)</label>
  <select id="category">
    <? for (var i = 0; i < categories.length; i++) { ?>
      <option><?= categories[i] ?></option>
    <? } ?>
  </select>

  <label for="question">質問</label>
  <textarea id="question" placeholder="例: 有給休暇は入社してからいつ使えるようになりますか?"></textarea>
  <button id="ask" type="button">質問する</button>

  <div id="history"></div>

  <p class="note">
    回答はAIが規程を読んで作成したものです。重要な判断の前には、根拠の条文を確認するか人事・総務に確認してください。<br>
    ログイン中: <?= userEmail ?>
  </p>
</main>

<script>
  var askBtn = document.getElementById('ask');
  var questionEl = document.getElementById('question');
  var categoryEl = document.getElementById('category');
  var historyEl = document.getElementById('history');

  askBtn.addEventListener('click', function () {
    var question = questionEl.value.trim();
    if (!question) return;

    var card = document.createElement('div');
    card.className = 'card';
    var q = document.createElement('div');
    q.className = 'q';
    q.textContent = question;
    var a = document.createElement('div');
    a.className = 'a';
    a.textContent = '最新の規程を確認しています…(30秒ほどかかることがあります)';
    card.appendChild(q);
    card.appendChild(a);
    historyEl.insertBefore(card, historyEl.firstChild);

    askBtn.disabled = true;
    google.script.run
      .withSuccessHandler(function (res) {
        a.textContent = res.answer;
        if (res.unreadable.length > 0) {
          var w = document.createElement('div');
          w.className = 'warn';
          w.textContent = '次の規程は文字を読み取れない形式のため、今回の回答の根拠に含まれていません: ' + res.unreadable.join('、');
          card.appendChild(w);
        }
        var meta = document.createElement('div');
        meta.className = 'meta';
        meta.appendChild(document.createTextNode('参照した規程: '));
        res.sources.forEach(function (s, i) {
          if (i > 0) meta.appendChild(document.createTextNode('、'));
          var link = document.createElement('a');
          link.href = s.url;
          link.target = '_blank';
          link.rel = 'noopener';
          link.textContent = s.name;
          meta.appendChild(link);
        });
        card.appendChild(meta);
        askBtn.disabled = false;
        questionEl.value = '';
      })
      .withFailureHandler(function (err) {
        a.className = 'a err';
        a.textContent = err.message || String(err);
        askBtn.disabled = false;
      })
      .ask(question, categoryEl.value);
  });
</script>
</body>
</html>
